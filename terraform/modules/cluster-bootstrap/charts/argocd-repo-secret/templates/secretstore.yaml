# The service account whose IRSA role can read only Argo CD's deploy key.
# External Secrets requests a token for it (no static credentials anywhere).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-secretstore
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.roleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: eso-secretstore
