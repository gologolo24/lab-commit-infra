# Produces the Argo CD repository Secret (label argocd.argoproj.io/secret-type).
# ESO's own template placeholders are escaped so Helm leaves them alone.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-gitops
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: repo-gitops
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: {{ .Values.repoUrl | quote }}
        sshPrivateKey: {{ "{{ .sshPrivateKey }}" | quote }}
  data:
    - secretKey: sshPrivateKey
      remoteRef:
        key: {{ .Values.deployKeySecret | quote }}
