# Settings for the "lab" environment. Every stack in envs/lab/* reads this file.
#
# New environment = copy envs/lab to envs/<new>, then change THIS file
# (and backend.hcl if it lives in another AWS account). No code changes.
# Not secret: secrets live in AWS Secrets Manager, never here.

environment: lab
name: lab-commit                # resource name prefix, must be unique per AWS account
account_id: "788717064995"      # Terraform refuses to run against any other account
region: us-east-1
aws_profile: commit-lab         # used by scripts/tf.sh
state_bucket: lab-commit-tfstate-788717064995

network:
  vpc_cidr: 10.20.0.0/16
  private_subnets:              # exactly 2 (PDF)
    a: { az: us-east-1a, cidr: 10.20.0.0/19 }
    b: { az: us-east-1b, cidr: 10.20.32.0/19 }

dns:
  zone_name: lab-commit.internal
  app_hostname: lab-commit-task # PDF: Lab-commit-task.<your-hosted-zone>
