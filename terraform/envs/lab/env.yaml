# Settings for the "lab" environment. Every stack in envs/lab/* reads this file.
#
# New environment = copy envs/lab to envs/<new>, then change THIS file
# (and backend.hcl if it lives in another AWS account). No code changes.
# Not secret: secrets live in AWS Secrets Manager, never here.

environment: lab
owner: leib                     # Owner tag on every resource of this environment
name: lab-commit                # resource name prefix, must be unique per AWS account
account_id: "788717064995"      # Terraform refuses to run against any other account
region: us-east-1
aws_profile: commit-lab         # used by scripts/tf.sh
state_bucket: lab-commit-tfstate-788717064995

network:
  vpc_cidr: 10.20.0.0/16
  private_subnets:              # exactly 2 (PDF)
    a: { az: us-east-1a, cidr: 10.20.0.0/19 }
    b: { az: us-east-1b, cidr: 10.20.32.0/19 }

dns:
  zone_name: lab-commit.internal
  app_hostname: lab-commit-task # PDF: Lab-commit-task.<your-hosted-zone>

eks:
  kubernetes_version: "1.36"    # PDF requirement (1.37 exists, but the PDF says 1.36)
  fargate_profiles:             # no node groups: every pod runs on Fargate (max 5 namespaces per profile)
    system: [kube-system, argocd, keda, monitoring, external-secrets]
    apps: [lab-commit, loadgen]
  addon_versions:               # aws eks describe-addon-versions --kubernetes-version 1.36
    coredns: v1.14.7-eksbuild.11
    metrics_server: v0.9.0-eksbuild.13

data:
  engine_version: "18"          # major only: RDS uses its recommended minor and applies minor patches itself
  instance_class: db.t4g.micro  # cheapest Graviton class
  allocated_storage_gb: 20
  multi_az: false               # lab: cost. Production: true
  db_name: labcommit
  app_user: app_reader          # read-only user, IAM authentication (created by the db-migrate job)

app:
  namespace: lab-commit         # backend and db-migrate service accounts live here

access:
  windows_instance_type: t3.large   # Windows + Chrome needs 8 GB RAM
  ops_instance_type: t4g.nano       # only forwards the EKS API port (SSM tunnel)
  windows_username: labuser         # RDP user (Remote Desktop Users, not admin); password only in Secrets Manager
  windows_password_version: 1       # bump to rotate the password

gitops:
  repo_url: git@github.com:gologolo24/lab-commit-gitops.git
  revision: main

cluster_bootstrap:
  api_tunnel_port: 8443         # scripts/eks-tunnel.sh must be running for this stack
  argocd_hostname: argocd       # -> argocd.<zone>
  charts:                       # pinned Helm chart versions
    external_secrets: 2.13.0
    aws_load_balancer_controller: 3.6.0   # matches the v3.6.0 IAM policy in modules/eks
    external_dns: 1.23.0
    argo_cd: 10.10.5            # Argo CD v3.5.5
    argocd_apps: 2.0.7
  grafana_password_version: 1   # bump to rotate the Grafana admin password

cicd:
  app_repo: gologolo24/lab-commit-app
  app_branch: main              # a push here that changes <service>/** starts that service's pipeline
  services:                     # one ECR repo + one pipeline per app folder
    frontend:
      smoke_path: /version      # deploy waits until this reports the new version
      smoke_field: .version
    backend:                    # internal only: checked through the frontend, which shows the backend's version
      smoke_path: /api/message
      smoke_field: .backend_version
  codebuild_image: aws/codebuild/amazonlinux-x86_64-standard:6.0   # x86 (Fargate is x86 only)
  image_retention_count: 20     # ECR keeps the last 20 images per service
  smoke_test_timeout_seconds: 900
