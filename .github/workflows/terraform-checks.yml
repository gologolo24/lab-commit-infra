# Static checks on every PR. No AWS credentials: nothing here touches the account.
# Deployments are done by Terraform from an operator machine (and CodePipeline for apps).
name: terraform-checks

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-checks.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-checks.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs (supply-chain best practice); the tag is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform

      - name: terraform validate (bootstrap, every module, every environment stack)
        run: |
          for dir in terraform/bootstrap/ terraform/modules/*/ terraform/envs/*/*/; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: tflint
        working-directory: terraform
        run: tflint --recursive --format compact

      - name: trivy (IaC misconfigurations)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          exit-code: "1"
          # Skip downloaded third-party modules (validate's `init` puts them in .terraform/).
          # Their example manifests aren't our code; we scan our own modules and stacks.
          skip-dirs: "**/.terraform"
