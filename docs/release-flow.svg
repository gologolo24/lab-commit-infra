<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="400" viewBox="0 0 1300 400" role="img" aria-labelledby="title desc">
  <title id="title">lab-commit release flow</title>
  <desc id="desc">A merged VERSION bump in lab-commit-app starts that service's CodePipeline: CodeBuild tests, builds and scans the image and pushes it to ECR, then commits the new image tag to lab-commit-gitops; Argo CD pulls the change and rolls it out; the pipeline's smoke test waits for the new version.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .h { font-size: 14px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
      .s { font-size: 12px; fill: #ffffff; text-anchor: middle; }
      .zone { font-size: 13px; font-weight: 700; }
      .lbl { font-size: 12px; fill: #1e293b; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      .leg { font-size: 12.5px; fill: #1e293b; }
      .line { stroke: #475569; stroke-width: 1.7; fill: none; }
      .dash { stroke-dasharray: 5 4; }
      .badge circle { fill: #0f172a; }
      .badge text { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="1300" height="400" rx="12" fill="#ffffff"/>

  <!-- zones -->
  <rect x="352" y="64" width="434" height="190" rx="8" fill="#fdf4ff" stroke="#c026d3" stroke-width="2"/>
  <text x="368" y="86" class="zone" fill="#86198f">CodePipeline V2 (one per service)</text>
  <text x="368" y="104" class="zone" fill="#86198f" style="font-weight:400;font-size:12px">CodeBuild in the VPC · no cluster access</text>
  <rect x="1006" y="64" width="282" height="190" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="1022" y="86" class="zone" fill="#1e3a8a">EKS</text>

  <!-- nodes -->
  <rect x="12" y="136" width="128" height="56" rx="28" fill="#475569"/>
  <text x="76" y="160" class="h">Developer</text>
  <text x="76" y="177" class="s">bumps VERSION</text>

  <rect x="176" y="132" width="140" height="64" rx="8" fill="#111827"/>
  <text x="246" y="158" class="h">lab-commit-app</text>
  <text x="246" y="176" class="s">GitHub · main</text>

  <rect x="370" y="118" width="180" height="92" rx="8" fill="#c026d3"/>
  <text x="460" y="142" class="h">Build</text>
  <text x="460" y="161" class="s">lint + unit tests</text>
  <text x="460" y="177" class="s">linux/amd64 image</text>
  <text x="460" y="193" class="s">ECR scan: no CRITICAL</text>

  <rect x="590" y="118" width="180" height="92" rx="8" fill="#c026d3"/>
  <text x="680" y="142" class="h">Deploy</text>
  <text x="680" y="161" class="s">new image tag → Git</text>
  <text x="680" y="177" class="s">smoke test: wait for</text>
  <text x="680" y="193" class="s">the new version</text>

  <rect x="816" y="132" width="166" height="64" rx="8" fill="#111827"/>
  <text x="899" y="158" class="h">lab-commit-gitops</text>
  <text x="899" y="176" class="s">GitHub · values.yaml</text>

  <rect x="1020" y="132" width="116" height="64" rx="8" fill="#2563eb"/>
  <text x="1078" y="158" class="h">Argo CD</text>
  <text x="1078" y="176" class="s">checks Git / 60 s</text>

  <rect x="1162" y="132" width="114" height="64" rx="8" fill="#16a34a"/>
  <text x="1219" y="158" class="h">new pods</text>
  <text x="1219" y="176" class="s">rolling update</text>

  <path d="M826,280 a70,10 0 0,0 140,0 v44 a70,10 0 0,1 -140,0 z" fill="#0e7490"/>
  <ellipse cx="896" cy="280" rx="70" ry="10" fill="#155e75"/>
  <text x="896" y="306" class="h">ECR</text>
  <text x="896" y="323" class="s">immutable tags</text>

  <!-- main chain -->
  <path d="M140,164 H174" class="line" marker-end="url(#arrow)"/>
  <path d="M316,164 H368" class="line" marker-end="url(#arrow)"/>
  <path d="M550,164 H588" class="line" marker-end="url(#arrow)"/>
  <path d="M770,164 H814" class="line" marker-end="url(#arrow)"/>
  <path d="M982,164 H1018" class="line" marker-end="url(#arrow)"/>
  <path d="M1136,164 H1160" class="line" marker-end="url(#arrow)"/>
  <path d="M460,210 V302 H824" class="line" marker-end="url(#arrow)"/>
  <g class="badge"><circle cx="342" cy="164" r="10"/><text x="342" y="168">1</text></g>
  <g class="badge"><circle cx="640" cy="302" r="10"/><text x="640" y="306">2</text></g>
  <g class="badge"><circle cx="570" cy="164" r="10"/><text x="570" y="168">3</text></g>
  <g class="badge"><circle cx="793" cy="164" r="10"/><text x="793" y="168">4</text></g>
  <g class="badge"><circle cx="1000" cy="164" r="10"/><text x="1000" y="168">5</text></g>
  <g class="badge"><circle cx="1148" cy="164" r="10"/><text x="1148" y="168">6</text></g>

  <!-- image pull and smoke test (dashed) -->
  <path d="M966,302 H1219 V198" class="line dash" marker-end="url(#arrow)"/>
  <text x="1060" y="296" class="lbl">image pull</text>
  <path d="M680,118 V36 H1219 V130" class="line dash" marker-end="url(#arrow)"/>
  <g class="badge"><circle cx="704" cy="36" r="10"/><text x="704" y="40">7</text></g>
  <text x="722" y="31" class="lbl">smoke test over HTTPS (internal ALB) until the new version is live</text>

  <!-- legend -->
  <g class="badge"><circle cx="24" cy="356" r="10"/><text x="24" y="360">1</text></g>
  <text x="40" y="360" class="leg">a push to main that changes frontend/** (or backend/**) starts only that pipeline</text>
  <g class="badge"><circle cx="24" cy="384" r="10"/><text x="24" y="388">2</text></g>
  <text x="40" y="388" class="leg">image pushed as &lt;version&gt;; an existing version fails the build</text>
  <g class="badge"><circle cx="600" cy="356" r="10"/><text x="600" y="360">4</text></g>
  <text x="616" y="360" class="leg">CodeBuild commits the tag with a deploy key valid for the GitOps repo only</text>
  <g class="badge"><circle cx="600" cy="384" r="10"/><text x="600" y="388">5</text></g>
  <text x="616" y="388" class="leg">Argo CD pulls the change; CI never touches the cluster</text>
</svg>
